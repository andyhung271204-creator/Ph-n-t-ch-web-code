# Sveltia CMS — trang quản trị bài Cẩm nang tại /admin. Mỗi lần Lưu = 1 commit lên main → Cloudflare tự build.
backend:
  name: github
  repo: andyhung271204-creator/Ph-n-t-ch-web-code
  branch: main
  base_url: https://sveltia-cms-auth.xaydunggiakhanh.workers.dev # Worker đăng nhập GitHub (sveltia/sveltia-cms-auth)

# Ảnh chèn trong thân bài
media_folder: /public/uploads/cam-nang
public_folder: /uploads/cam-nang
media_libraries:
  all:
    transformations:
      raster_image: { format: webp, quality: 85, width: 2000, height: 2000 } # nén ảnh điện thoại khi tải lên

collections:
  # Hai nhóm cùng thư mục, tách theo trường draft. Bỏ tích "Bản nháp" → bài chuyển sang "Đã đăng".
  - name: cam-nang-chua-duyet
    label: Chưa duyệt
    label_singular: Bài chờ duyệt
    folder: noi-dung/cam-nang
    filter: { field: draft, value: true }
    extension: md
    format: frontmatter
    create: true # bài tạo mới luôn là bản nháp (draft mặc định true)
    slug: '{{fields.slug}}'
    fields: &cam-nang-fields
      - { name: title, label: Tiêu đề, widget: string }
      - name: slug
        label: Đường dẫn URL
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Chỉ chữ thường không dấu, số và gạch ngang']
        hint: 'VD: chi-phi-xay-nha-3-tang → xaydunggiakhanh.vn/cam-nang/chi-phi-xay-nha-3-tang. Không đổi được sau khi đăng.'
      - name: category
        label: Chuyên mục
        widget: relation # danh sách lấy từ Cài đặt → Chuyên mục
        collection: cai-dat
        file: chuyen-muc
        value_field: 'items.*.slug'
        display_fields: ['items.*.name']
        search_fields: ['items.*.name']
      - { name: date, label: Ngày đăng, widget: datetime, hint: 'Bài mới nhất hiện đầu tiên ở trang chủ' }
      - { name: draft, label: Bản nháp (ẩn khỏi web), widget: boolean, default: true, required: false }
      - { name: excerpt, label: Tóm tắt, widget: text, hint: '1–2 câu, hiện trên thẻ bài và đầu bài viết' }
      - name: cover
        label: Ảnh bìa
        widget: image
        media_folder: /src/assets/cam-nang
        public_folder: /src/assets/cam-nang
        hint: 'Chỉ dùng ảnh công trình thật của Gia Khánh, không dùng ảnh sưu tầm.'
      - { name: meta_title, label: Tiêu đề SEO, widget: string, required: false, hint: 'Bỏ trống = dùng Tiêu đề' }
      - { name: meta_description, label: Mô tả SEO, widget: text, required: false, hint: 'Tối đa ~160 ký tự. Bỏ trống = dùng Tóm tắt' }
      - name: body
        label: Nội dung
        widget: richtext
        editor_components: [image, table, hr] # bảng, đường kẻ ngang cần Sveltia ≥ 0.237
        hint: >-
          Không cần viết lại tiêu đề. Quy ước: [ẢNH: mô tả] = khung chờ ảnh · [cần xác nhận: …] = đoạn tô vàng ·
          câu hỏi in đậm kết thúc bằng "?", Shift+Enter rồi viết trả lời = mục hỏi đáp thu gọn ·
          một dòng chứa [Nhận báo giá miễn phí] = cụm nút báo giá/gọi/Zalo ·
          mục "Nguồn tham khảo" cuối bài không hiện trên web.

  - name: cam-nang-da-dang
    label: Đã đăng
    label_singular: Bài đã đăng
    folder: noi-dung/cam-nang
    filter: { field: draft, value: false }
    extension: md
    format: frontmatter
    create: false
    slug: '{{fields.slug}}'
    fields: *cam-nang-fields

  - name: cai-dat
    label: Cài đặt
    files:
      - name: chuyen-muc
        label: Chuyên mục
        file: noi-dung/chuyen-muc.json
        fields:
          - name: items
            label: Chuyên mục
            label_singular: chuyên mục
            widget: list
            hint: 'Kéo để đổi thứ tự hiển thị. Chuyên mục chưa có bài sẽ tự ẩn trên web.'
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Tên hiển thị, widget: string, hint: 'Đổi tên thoải mái, bài viết không bị ảnh hưởng' }
              - name: slug
                label: Mã chuyên mục
                widget: string
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Chỉ chữ thường không dấu, số và gạch ngang']
                hint: 'VD: phong-thuy. KHÔNG đổi/xoá mã khi đã có bài dùng nó — web sẽ không build được.'
